name: MatchIQ forward settlement check (development branch only)
# Runs ONLY on a push to dev/mission065-best-bet that changes .github/forward-check-request.txt.
# One football-data.org refresh, settlement of the public PUB- ledger and a seven-point verification.
# The Odds API key is deliberately NOT passed, so no bookmaker credits are spent. No deploy, never main.
on:
  push:
    branches: ['dev/mission065-best-bet']
    paths: ['.github/forward-check-request.txt']
permissions:
  contents: write
concurrency:
  group: matchiq-forward-check
  cancel-in-progress: false
jobs:
  settle:
    if: github.ref == 'refs/heads/dev/mission065-best-bet'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Refresh fixtures and settle (football-data.org only; no Odds API key)
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: python -m pipeline.run
      - run: python build_public_dist.py
      - name: Seven-point forward verification
        run: python -m pipeline.forward_check
      - name: Commit results to this branch
        if: always()
        run: |
          git config user.name 'matchiq-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fixtures.json data/predictions.json data/prediction_history.json data/shadow_history.json data/performance.json data/pipeline_status.json data/public data/forward_check/report.json public-dist
          git commit -m 'Forward settlement check' || exit 0
          git pull --rebase
          git push
