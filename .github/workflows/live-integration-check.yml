name: MatchIQ live API check (development branch only)
# Runs ONLY when a push to dev/mission065-best-bet changes .github/live-check-request.txt.
# Read-only against the providers, never deploys, never touches main, publishes nothing.
# It commits one sanitised report (data/live_check/report.json) back to this same branch.
on:
  push:
    branches: ['dev/mission065-best-bet']
    paths: ['.github/live-check-request.txt']
permissions:
  contents: write
concurrency:
  group: matchiq-live-check
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/dev/mission065-best-bet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Live check (about 6 free requests and at most 18 Odds API credits)
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m pipeline.live_check > /dev/null
      - name: Commit the sanitised report to this branch
        run: |
          git config user.name 'matchiq-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live_check/report.json
          git commit -m 'Live API check report' || exit 0
          git pull --rebase
          git push
  refresh:
    # Full pipeline on this development branch only (never main, no deploy). Spends Odds API
    # credits under the pipeline's own budget rules; commits data back to this branch.
    needs: check
    if: github.ref == 'refs/heads/dev/mission065-best-bet'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/mission065-best-bet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          for t in tests/*.js; do node "$t"; done
      - name: Refresh (football-data.co.uk downloads stay disabled)
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m pipeline.run
      - run: python build_public_dist.py
      - name: Commit data to this branch
        if: always()
        run: |
          git config user.name 'matchiq-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fixtures.json data/predictions.json data/prediction_history.json data/shadow_history.json data/performance.json data/pipeline_status.json data/odds.json public-dist
          git commit -m 'Dev-branch live refresh' || exit 0
          git pull --rebase
          git push
