name: Publish MatchIQ to GitHub Pages
# Free hosting. Publishes only the allowlisted public-dist/ bundle (see build_public_dist.py),
# never the repository root. Runs on every push to main that touches the bundle, and after each
# data refresh, so the live site always shows the latest committed predictions and prices.
on:
  push:
    branches: [main]
    paths: ['public-dist/**']
  workflow_run:
    workflows: ['MatchIQ fixture, prediction and history refresh']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Node 24 releases: the Node 20 versions (upload v3, deploy v4) failed to find the uploaded
      # artifact ("Found 0 artifact(s)") once runners forced them onto Node 24 in November 2026.
      # v4+ of the upload action leaves out dotfiles (.gitignore, .vercel), which is intended.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
