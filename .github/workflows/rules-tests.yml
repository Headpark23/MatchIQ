name: Firestore security rules tests
# Runs tests/rules against the Firestore emulator (needs Java, which GitHub provides),
# so nobody has to install anything locally to check the rules.
on:
  workflow_dispatch:
  push:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'league_sync.js'
      - 'tests/rules/**'
      - '.github/workflows/rules-tests.yml'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install rules test dependencies
        working-directory: tests/rules
        run: npm ci
      - name: Run rules tests in the Firestore emulator
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project betbuddyuk "npm --prefix tests/rules test"
