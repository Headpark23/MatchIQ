name: MatchIQ offline settlement safety tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'forward_test.py'
      - 'match_winner_forward.py'
      - 'tests/test_settlement_safety.py'
      - '.github/workflows/settlement-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated experiment dependency
        run: python -m pip install 'penaltyblog>=1.0,<2'
      - name: Run synthetic offline settlement tests
        run: python tests/test_settlement_safety.py
