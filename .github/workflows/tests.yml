name: Tests
# Runs the Python and JS suites on every pull request and push to main, so a change
# cannot land without them (they previously ran only inside the data-refresh workflow).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r pipeline/requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: for t in tests/*.js; do node "$t" || exit 1; done
