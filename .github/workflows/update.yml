name: Refresh football data
on:
  schedule:
    - cron: '15 5,17 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate
        run: python update_data.py
      - name: Commit updated data
        run: |
          git config user.name 'matchiq-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/matches.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Premier League statistics'
            git push
          fi
